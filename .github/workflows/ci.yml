name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      # Engine is injected and tests use fakes — no Stockfish binary needed.
      - name: Test
        run: pytest tests/ -v

  frontend:
    name: Frontend (test + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install deps
        run: yarn install --immutable
      - name: Unit tests
        run: yarn test
      - name: Lint (eslint)
        run: yarn lint
      - name: Lint CSS (stylelint)
        run: yarn lint:css
      - name: Build
        run: yarn build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: |
            frontend/yarn.lock
            e2e/yarn.lock
      # e2e boots the frontend dev server itself, so it needs those deps too.
      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --immutable
      - name: Install e2e deps
        working-directory: e2e
        run: yarn install --immutable
      - name: Install Playwright browser
        working-directory: e2e
        run: yarn playwright install --with-deps chromium
      - name: Run e2e
        working-directory: e2e
        # html reporter on top of the config's 'list', for the artifact below.
        run: yarn playwright test --reporter=list,html
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
