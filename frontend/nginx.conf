# Rate limit for the expensive /api/reviews endpoint. Lives at http{} scope —
# this file is `include`d inside http{} by the nginx:alpine base image's
# nginx.conf (via conf.d/*.conf), so a zone declared here, outside any
# server{} block, is valid at http scope.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# Ports are 8080/8443, not 80/443: the image runs unprivileged (uid 101) and
# cannot bind <1024. Compose maps the real 80/443 onto these, so nothing
# changes for clients — but $host-based redirects below must NOT gain an
# explicit port, or they would leak :8443 to the browser.

# Plain HTTP exists only to redirect — no app content served unencrypted.
server {
    listen 8080;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;

    # Local sim: mkcert-issued pair for chessreview.localhost. Prod: real
    # Let's Encrypt pair for the public hostname.
    # Only the mounted cert files differ between environments — this config
    # is identical.
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        include /etc/nginx/security-headers.conf;
    }

    location /engine/ {
        root /usr/share/nginx/html;

        # Long-lived cache: engine builds are content-addressed by their own
        # versioned filename (stockfish-19*.js/.wasm), never mutated in place,
        # so a fetch that's already landed in the browser's HTTP cache is safe
        # to reuse forever — the one download really only happens once.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        include /etc/nginx/security-headers.conf;
    }

    # Same-origin API proxy: no CORS needed for our own frontend.
    # proxy_buffering off is required for the review SSE stream — nginx
    # buffers proxied responses by default, which breaks move-by-move
    # delivery until the buffer fills or the response ends.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;

        include /etc/nginx/security-headers.conf;
    }

    # Rate limit the expensive review-submission endpoint specifically.
    # Longest-prefix match wins over the generic /api/ location above.
    location /api/reviews {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;

        proxy_pass http://backend:8000/reviews;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;

        include /etc/nginx/security-headers.conf;
    }
}
