# Shared security headers. `add_header` in a location drops all headers
# inherited from the parent server block, so every location that wants them
# must `include` this file rather than relying on inheritance.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Only ever served from the 443 server block (the 80 server is redirect-only),
# so this never leaks onto a plain-HTTP response.
add_header Strict-Transport-Security "max-age=31536000" always;

# Cross-origin isolation: required for SharedArrayBuffer -> multi-threaded
# WASM Stockfish (analyze tab). Mirrors the dev/preview headers in
# vite.config.ts.
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
